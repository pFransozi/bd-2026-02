<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1680" height="670" viewBox="0 0 1680 670" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Arquitetura conceitual de acesso ao PostgreSQL</title>
<desc id="descricao">Duas formas de acesso: uma pessoa utiliza o cliente DBeaver com driver JDBC; uma aplicação Python utiliza o driver psycopg. Ambas enviam comandos em SQL ao servidor PostgreSQL, que gerencia os bancos de dados.</desc>
<defs>
  <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF7FF"/><stop offset="1" stop-color="#DDEEFF"/></linearGradient>
  <linearGradient id="principal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ECF7FF"/><stop offset="1" stop-color="#D3EAFF"/></linearGradient>
  <linearGradient id="roxo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F1FF"/><stop offset="1" stop-color="#E9DFFA"/></linearGradient>
  <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1FBF2"/><stop offset="1" stop-color="#DBF1DE"/></linearGradient>
  <linearGradient id="amarelo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFCF5"/><stop offset="1" stop-color="#FFF0D6"/></linearGradient>
  <filter id="sombra" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#123553" flood-opacity=".08"/></filter>
  <marker id="seta" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9Z" fill="#174C7F"/></marker>
  <marker id="setaDupla" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M8 1L1 5L8 9Z" fill="#174C7F"/></marker>
  <style>
    .label{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#152B49;font-weight:750}
    .sub{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#43556F;font-weight:520}
    .line{fill:none;stroke:#174C7F;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    .box{filter:url(#sombra);stroke-width:3.3}
    .small{font-size:25px}
    .medium{font-size:31px}
    .large{font-size:39px}
  </style>
</defs>
<rect width="1680" height="670" fill="#FFFFFF"/>
<!-- Usuário -->
<rect x="25" y="244" width="213" height="262" rx="24" fill="url(#azul)" stroke="#174C7F" class="box"/>
<circle cx="130" cy="308" r="28" fill="#C1DCF4" stroke="#174C7F" stroke-width="6"/>
<path d="M100 312q30-36 60 0" stroke="#174C7F" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M68 400q2-62 61-62q61 0 66 62v25H68Z" fill="#80AFE1" stroke="#174C7F" stroke-width="6"/>
<rect x="91" y="382" width="83" height="51" rx="6" fill="#E4F4FF" stroke="#174C7F" stroke-width="5"/>
<text x="131" y="466" text-anchor="middle" font-size="30" class="label">Usuário</text>
<text x="131" y="493" text-anchor="middle" font-size="22" class="sub">/ sistema</text>
<!-- Duas rotas -->
<path d="M239 370H260V290H285" class="line" marker-end="url(#seta)"/>
<path d="M260 370V471H285" class="line" marker-end="url(#seta)"/>
<!-- Cliente -->
<rect x="300" y="238" width="279" height="126" rx="20" fill="url(#azul)" stroke="#1470B0" class="box"/>
<ellipse cx="355" cy="269" rx="28" ry="11" fill="#C4E4F9" stroke="#1470B0" stroke-width="4"/>
<path d="M327 269v47q28 19 56 0v-47M327 285q28 18 56 0M327 301q28 18 56 0" fill="none" stroke="#1470B0" stroke-width="4"/>
<text x="399" y="288" class="label medium">Cliente</text>
<text x="399" y="326" class="sub small">DBeaver</text>
<!-- Aplicação -->
<rect x="300" y="419" width="279" height="126" rx="20" fill="url(#azul)" stroke="#1470B0" class="box"/>
<path d="M362 455l-20 24l20 24M387 455l20 24l-20 24M383 451l-14 58" fill="none" stroke="#1470B0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="414" y="468" class="label medium">Aplicação</text>
<text x="414" y="507" class="sub small">Python</text>
<!-- Conexões cliente→drivers -->
<path d="M580 300H612" class="line" marker-end="url(#seta)"/>
<path d="M580 483H612" class="line" marker-end="url(#seta)"/>
<!-- Drivers -->
<rect x="627" y="252" width="214" height="99" rx="18" fill="url(#roxo)" stroke="#6A4CB1" class="box"/>
<g transform="translate(670 301)" fill="none" stroke="#7150B7" stroke-width="5">
  <circle r="22"/><circle r="9"/><path d="M0-36v13M0 23v13M-36 0h13M23 0h13M-25-25l9 9M16 16l9 9M25-25l-9 9M-16 16l-9 9"/>
</g>
<text x="718" y="292" class="label medium">Driver</text><text x="718" y="326" class="sub small">JDBC</text>
<rect x="627" y="434" width="214" height="99" rx="18" fill="url(#roxo)" stroke="#6A4CB1" class="box"/>
<g transform="translate(670 483)" fill="none" stroke="#7150B7" stroke-width="5">
  <circle r="22"/><circle r="9"/><path d="M0-36v13M0 23v13M-36 0h13M23 0h13M-25-25l9 9M16 16l9 9M25-25l-9 9M-16 16l-9 9"/>
</g>
<text x="718" y="474" class="label medium">Driver</text><text x="718" y="508" class="sub small">psycopg</text>
<!-- Servidor -->
<path d="M842 302H862Q884 302 884 325V376H914" class="line" marker-end="url(#seta)"/>
<path d="M842 484H862Q884 484 884 462V410H914" class="line" marker-end="url(#seta)"/>
<rect x="923" y="238" width="382" height="308" rx="26" fill="url(#principal)" stroke="#174C7F" class="box"/>
<!-- Elefante estilizado ao centro do painel -->
<g transform="translate(972 333)" fill="none" stroke="#22679B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <path d="M37-44Q8-53-2-25Q-15 18 12 28Q23 32 33 25L32 57Q39 83 59 73Q69 65 61 48L61 3Q84 19 102 4Q111-8 104-27Q96-50 70-43Q55-53 37-44Z" fill="#92C6EE"/>
  <path d="M57-30Q42-12 49 14M51 26Q49 51 58 61M8-14Q27-22 37-7M77-15Q91-22 104-6" stroke="#174C7F"/>
  <circle cx="33" cy="-4" r="4" fill="#174C7F" stroke="none"/>
</g>
<text x="1091" y="360" class="label large">PostgreSQL</text>
<text x="1091" y="405" class="sub large">(SGBD)</text>
<text x="1113" y="477" text-anchor="middle" class="sub" font-size="23">Servidor de banco de dados</text>
<!-- SQL -->
<rect x="944" y="60" width="350" height="117" rx="22" fill="url(#amarelo)" stroke="#C89422" class="box"/>
<path d="M1000 83h44l20 21v47h-64zM1044 83v22h20" fill="none" stroke="#174C7F" stroke-width="5" stroke-linejoin="round"/>
<path d="M1011 121l-8 6l8 6M1050 121l8 6l-8 6M1034 118l-6 20" fill="none" stroke="#174C7F" stroke-width="4"/>
<text x="1090" y="132" class="label" font-size="48">SQL</text>
<path d="M1118 178V225" stroke="#174C7F" stroke-width="5" stroke-dasharray="9 11" fill="none" marker-end="url(#seta)"/>
<!-- Banco de dados -->
<path d="M1308 383H1390" class="line" marker-start="url(#setaDupla)" marker-end="url(#seta)"/>
<rect x="1402" y="254" width="252" height="286" rx="25" fill="url(#verde)" stroke="#27814C" class="box"/>
<ellipse cx="1529" cy="317" rx="67" ry="25" fill="#BFE7CF" stroke="#27814C" stroke-width="6"/>
<path d="M1462 317v84q67 41 134 0v-84M1462 358q67 41 134 0M1462 399q67 41 134 0" stroke="#27814C" stroke-width="6" fill="none"/>
<text x="1528" y="464" text-anchor="middle" class="label medium">Banco de</text>
<text x="1528" y="503" text-anchor="middle" class="label medium">dados</text>
</svg>