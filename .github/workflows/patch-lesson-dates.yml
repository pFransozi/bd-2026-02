name: Patch lesson date labels

on:
  push:
    branches:
      - chore/remover-datas-aulas

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remover-datas-aulas

      - name: Remove lesson date labels only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aula-03.html')
          text = path.read_text(encoding='utf-8')

          old_hero = '<p class="eyebrow">Aula 03 · 12/08/2026</p>'
          new_hero = '<p class="eyebrow">Aula 03</p>'
          old_footer = 'Engenharia de Software · 12/08/2026'
          new_footer = 'Engenharia de Software · Aula 03'

          if text.count(old_hero) != 1:
              raise SystemExit(f'Hero esperado exatamente uma vez; encontrado {text.count(old_hero)}')
          if text.count(old_footer) != 1:
              raise SystemExit(f'Rodapé esperado exatamente uma vez; encontrado {text.count(old_footer)}')

          text = text.replace(old_hero, new_hero, 1)
          text = text.replace(old_footer, new_footer, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-lesson-dates.yml
          git add -- aula-03.html .github/workflows/patch-lesson-dates.yml
          git commit -m "Remove data da identificação da Aula 03"
          git push origin HEAD:chore/remover-datas-aulas
